<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Beat Log — Promoter Visit Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E2226">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BeatLog">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite:#1E2226;
    --graphite-2:#2A2F34;
    --paper:#F3EFE6;
    --panel:#FFFFFF;
    --ink:#22201C;
    --ink-soft:#635C50;
    --amber:#E08A1E;
    --amber-dark:#B5690F;
    --tread:#3D4349;
    --good:#4F7942;
    --bad:#B23A2E;
    --line:#DDD5C4;
    --radius:10px;
    --shadow: 0 2px 10px rgba(30,34,38,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{ background:var(--amber); color:#fff; }

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:78px;
  }

  /* ---------- HEADER (gauge cluster) ---------- */
  header.top{
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 8px),
      linear-gradient(180deg, var(--graphite), var(--graphite-2));
    color:#EFE9DD;
    padding:22px 18px 16px;
    border-bottom:4px solid var(--amber);
    position:relative;
  }
  header.top .brand-row{
    display:flex; align-items:baseline; justify-content:space-between;
  }
  header.top h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    letter-spacing:0.5px;
    font-size:24px;
    margin:0;
    text-transform:uppercase;
  }
  header.top h1 span{ color:var(--amber); }
  header.top .odo{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:#B9B2A2;
    background:rgba(0,0,0,0.25);
    padding:4px 8px;
    border-radius:4px;
    letter-spacing:0.5px;
  }
  header.top .odo.sync-error{
    background:rgba(178,58,46,0.35);
    color:#F5CFC9;
  }
  header.top .sub{
    margin-top:4px;
    font-size:12.5px;
    color:#B9B2A2;
    font-family:'IBM Plex Mono', monospace;
  }

  /* ---------- TABS ---------- */
  nav.tabs{
    position:fixed;
    bottom:0; left:0; right:0;
    max-width:480px;
    margin:0 auto;
    background:var(--graphite);
    display:flex;
    border-top:1px solid #000;
    z-index:50;
  }
  nav.tabs button{
    flex:1;
    background:none;
    border:none;
    color:#8B8578;
    font-family:'Oswald', sans-serif;
    font-size:12px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    padding:12px 4px 10px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    transition:color .15s;
  }
  nav.tabs button .ic{ font-size:18px; line-height:1; }
  nav.tabs button.active{ color:var(--amber); }
  nav.tabs button.active::before{
    content:'';
    position:absolute;
    margin-top:-13px;
    width:28px; height:2px;
    background:var(--amber);
  }

  /* ---------- MAIN ---------- */
  main{ padding:16px; flex:1; }
  .screen{ display:none; animation:fade .18s ease; }
  .screen.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .section-title{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    font-size:13px;
    letter-spacing:1px;
    color:var(--ink-soft);
    margin:22px 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }
  .section-title:first-child{ margin-top:2px; }

  label.field{ display:block; margin-bottom:14px; }
  label.field .lbl{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  input[type=text], input[type=date], input[type=tel], input[type=number], textarea, select{
    width:100%;
    border:1.5px solid var(--line);
    background:var(--panel);
    border-radius:8px;
    padding:11px 12px;
    font-size:15px;
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus, select:focus{
    border-color:var(--amber);
    box-shadow:0 0 0 3px rgba(224,138,30,0.15);
  }
  textarea{ resize:vertical; min-height:64px; }

  .geo-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .geo-btn{
    background:var(--graphite); color:#F3EFE6; border:none; border-radius:7px;
    padding:9px 14px; font-family:'IBM Plex Sans'; font-weight:600; font-size:12.5px;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:background .15s;
  }
  .geo-btn:active{ background:var(--amber-dark); }
  .geo-btn:disabled{ opacity:0.6; cursor:default; }
  .geo-status{ font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace; }
  .geo-status.ok{ color:var(--good); }
  .geo-status.err{ color:var(--bad); }

  /* segmented control */
  .segmented{ display:flex; border:1.5px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel); }
  .segmented button{
    flex:1; border:none; background:none; padding:11px 6px;
    font-family:'IBM Plex Sans'; font-weight:600; font-size:13.5px;
    color:var(--ink-soft); cursor:pointer; border-right:1.5px solid var(--line);
  }
  .segmented button:last-child{ border-right:none; }
  .segmented button.sel{ background:var(--graphite); color:#F3EFE6; }

  /* chip select for category */
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding:8px 13px; border-radius:20px; border:1.5px solid var(--line);
    background:var(--panel); font-size:13px; font-weight:600; color:var(--ink-soft);
    cursor:pointer; font-family:'IBM Plex Mono', monospace; letter-spacing:0.3px;
  }
  .chip.sel{ background:var(--amber); border-color:var(--amber-dark); color:#fff; }

  /* Yes/No toggle */
  .yn{ display:flex; gap:10px; }
  .yn button{
    flex:1; padding:12px; border-radius:8px; border:1.5px solid var(--line);
    background:var(--panel); font-family:'Oswald'; font-weight:600; letter-spacing:0.5px;
    font-size:14px; text-transform:uppercase; color:var(--ink-soft); cursor:pointer;
  }
  .yn button.yes.sel{ background:var(--good); border-color:var(--good); color:#fff; }
  .yn button.no.sel{ background:var(--bad); border-color:var(--bad); color:#fff; }

  /* gauge dial for market share */
  .gauge-wrap{ display:flex; align-items:center; gap:16px; }
  .gauge{ position:relative; width:96px; height:96px; flex-shrink:0; }
  .gauge svg{ transform:rotate(-90deg); }
  .gauge .val{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:18px; color:var(--ink);
  }
  .gauge-slider{ flex:1; }
  input[type=range]{
    width:100%; -webkit-appearance:none; height:6px; border-radius:3px;
    background:var(--line); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
    background:var(--amber); border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,0.3); cursor:pointer;
  }
  .gauge-slider .cap{ font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono'; margin-top:4px; }

  /* brand ranking */
  .rank-list{ display:flex; flex-direction:column; gap:6px; }
  .rank-item{
    display:flex; align-items:center; gap:10px;
    background:var(--panel); border:1.5px solid var(--line); border-radius:8px;
    padding:9px 10px; cursor:grab; user-select:none;
  }
  .rank-item.dragging{ opacity:0.4; }
  .rank-item .num{
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:12px;
    width:22px; height:22px; border-radius:4px; background:var(--tread); color:var(--amber);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .rank-item .name{ flex:1; font-weight:600; font-size:14px; }
  .rank-item .grip{ color:var(--line); font-size:16px; letter-spacing:2px; color:#BDB6A5; }
  .rank-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; font-style:italic; }

  .save-bar{
    position:sticky; bottom:0; background:linear-gradient(180deg, transparent, var(--paper) 30%);
    padding-top:14px; margin-top:6px;
  }
  button.primary{
    width:100%; background:var(--amber); color:#fff; border:none; border-radius:9px;
    padding:15px; font-family:'Oswald', sans-serif; font-weight:600; font-size:15px;
    letter-spacing:0.6px; text-transform:uppercase; cursor:pointer; box-shadow:var(--shadow);
    transition:background .15s, transform .05s;
  }
  button.primary:active{ transform:scale(0.99); background:var(--amber-dark); }
  button.ghost{
    width:100%; background:none; color:var(--ink-soft); border:1.5px solid var(--line);
    border-radius:9px; padding:12px; font-family:'Oswald'; font-weight:600; font-size:13px;
    text-transform:uppercase; letter-spacing:0.5px; cursor:pointer; margin-top:8px;
  }

  /* ---------- HISTORY ---------- */
  .search-row{ display:flex; gap:8px; margin-bottom:12px; }
  .search-row input{ flex:1; }
  .filter-chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; }
  .filter-chip-row .chip{ white-space:nowrap; flex-shrink:0; }

  .visit-card{
    background:var(--panel); border:1.5px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:12px; box-shadow:var(--shadow); position:relative;
  }
  .visit-card .vc-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .visit-card .vc-name{ font-family:'Oswald'; font-size:16px; font-weight:600; }
  .visit-card .vc-type{
    font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--ink-soft);
    background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:2px 6px;
    text-transform:uppercase; margin-top:3px; display:inline-block;
  }
  .vc-badge{
    font-family:'Oswald'; font-size:11px; font-weight:600; text-transform:uppercase;
    padding:4px 9px; border-radius:20px; color:#fff; letter-spacing:0.4px; flex-shrink:0;
  }
  .vc-badge.yes{ background:var(--good); }
  .vc-badge.no{ background:var(--bad); }
  .vc-meta{
    display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px;
    font-size:12.5px; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace;
  }
  .vc-meta b{ color:var(--ink); font-weight:600; }
  .vc-remarks{ margin-top:8px; font-size:13px; color:var(--ink); font-style:italic; }
  .vc-actions{ display:flex; gap:8px; margin-top:10px; }
  .vc-actions button{
    flex:1; background:var(--paper); border:1px solid var(--line); border-radius:6px;
    padding:7px; font-size:12px; font-weight:600; cursor:pointer; color:var(--ink-soft);
  }
  .vc-actions button.del{ color:var(--bad); }

  .empty{
    text-align:center; padding:50px 20px; color:var(--ink-soft);
  }
  .empty .ic{ font-size:38px; margin-bottom:10px; }
  .empty p{ font-size:13.5px; line-height:1.5; }

  /* ---------- DASHBOARD ---------- */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .stat-card{
    background:var(--graphite); color:#EFE9DD; border-radius:var(--radius); padding:14px;
    position:relative; overflow:hidden;
  }
  .stat-card .n{ font-family:'IBM Plex Mono', monospace; font-size:26px; font-weight:600; color:var(--amber); }
  .stat-card .l{ font-family:'Oswald'; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:#B9B2A2; margin-top:2px; }

  .bar-row{ margin-bottom:10px; }
  .bar-row .bl{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; font-family:'IBM Plex Mono'; }
  .bar-row .bl b{ font-weight:600; }
  .bar-track{ height:9px; background:var(--line); border-radius:5px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--amber); border-radius:5px; }

  #toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--graphite); color:#F3EFE6; padding:11px 20px; border-radius:8px;
    font-size:13.5px; font-weight:500; opacity:0; pointer-events:none; transition:all .25s;
    z-index:100; max-width:90%; text-align:center; border-left:3px solid var(--amber);
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand-row">
      <h1>Beat<span>Log</span></h1>
      <div class="odo" id="odo">000 VISITS</div>
    </div>
    <div class="sub">Promoter field visit tracker</div>
  </header>

  <main>

    <!-- ============ NEW VISIT ============ -->
    <section class="screen active" id="screen-new">

      <div class="section-title">Visit Details</div>
      <label class="field">
        <span class="lbl">Name of Stockist</span>
        <select id="stockistName">
          <option value="">Select stockist...</option>
          <option value="Nalateswari Lubricants">Nalateswari Lubricants</option>
          <option value="Bihariji Auto Service Station">Bihariji Auto Service Station</option>
          <option value="Takshvi Co">Takshvi Co</option>
        </select>
      </label>
      <label class="field">
        <span class="lbl">Date of Visit</span>
        <input type="date" id="visitDate">
      </label>
      <label class="field">
        <span class="lbl">Visiting a...</span>
        <div class="segmented" id="visitType">
          <button data-v="Reseller" class="sel">Reseller</button>
          <button data-v="Garage">Garage</button>
        </div>
      </label>

      <div class="section-title">Outlet Details</div>
      <label class="field">
        <span class="lbl" id="ownerLbl">Name of Reseller / Mechanic</span>
        <input type="text" id="ownerName" placeholder="Outlet or mechanic name">
      </label>
      <label class="field">
        <span class="lbl">Contact Number</span>
        <input type="tel" id="contact" placeholder="10-digit mobile number" maxlength="15">
      </label>
      <label class="field">
        <span class="lbl">Address</span>
        <div class="geo-row">
          <button type="button" class="geo-btn" id="geoBtn">📍 Use Current Location</button>
          <span class="geo-status" id="geoStatus"></span>
        </div>
        <textarea id="address" placeholder="Shop no., street, area, city — or tap 'Use Current Location' above"></textarea>
      </label>
      <label class="field">
        <span class="lbl">Category</span>
        <div class="chips" id="categoryChips">
          <div class="chip" data-v="2W">2W</div>
          <div class="chip" data-v="CV">CV</div>
          <div class="chip" data-v="PCMO">PCMO</div>
          <div class="chip" data-v="Industrial">Industrial</div>
          <div class="chip" data-v="OEM">OEM</div>
        </div>
      </label>
      <label class="field">
        <span class="lbl">Volume per Month (Litres)</span>
        <input type="number" id="volume" placeholder="e.g. 120" min="0" step="1">
      </label>

      <div class="section-title">Market Insight</div>
      <label class="field">
        <span class="lbl">Brand Preference Ranking <span style="font-weight:400;text-transform:none;">(drag to reorder — top = most preferred)</span></span>
        <div class="rank-list" id="rankList"></div>
        <div class="rank-hint">Long-press and drag ≡ to rank brands at this outlet</div>
      </label>
      <label class="field">
        <span class="lbl">Servo Market Share at Outlet</span>
        <div class="gauge-wrap">
          <div class="gauge">
            <svg width="96" height="96" viewBox="0 0 96 96">
              <circle cx="48" cy="48" r="40" fill="none" stroke="#DDD5C4" stroke-width="10"/>
              <circle id="gaugeArc" cx="48" cy="48" r="40" fill="none" stroke="#E08A1E" stroke-width="10"
                stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="251.3"/>
            </svg>
            <div class="val" id="gaugeVal">0%</div>
          </div>
          <div class="gauge-slider">
            <input type="range" id="marketShare" min="0" max="100" value="0" step="1">
            <div class="cap">Slide to set estimated share</div>
          </div>
        </div>
      </label>

      <div class="section-title">Requirements</div>
      <label class="field">
        <span class="lbl">Branding Requirement</span>
        <select id="branding">
          <option value="">Select status...</option>
          <option value="Available">Available</option>
          <option value="Available but in poor condition">Available but in poor condition</option>
          <option value="Flex Board">Flex Board</option>
          <option value="GSB">GSB</option>
          <option value="Servoxpert">Servoxpert</option>
          <option value="ACP">ACP</option>
          <option value="NON LIT">NON LIT</option>
          <option value="ACP LIT">ACP LIT</option>
          <option value="IN shop">IN shop</option>
        </select>
      </label>
      <label class="field">
        <span class="lbl">Product Requirement</span>
        <textarea id="productReq" placeholder="SKUs / grades / pack sizes needed"></textarea>
      </label>
      <label class="field">
        <span class="lbl">Converted to Servo</span>
        <div class="yn" id="converted">
          <button class="yes" data-v="Yes">Yes</button>
          <button class="no" data-v="No">No</button>
        </div>
      </label>
      <label class="field">
        <span class="lbl">Remarks</span>
        <textarea id="remarks" placeholder="Notes, follow-up plan, objections..."></textarea>
      </label>

      <div class="save-bar">
        <button class="primary" id="saveBtn">Save Visit</button>
        <button class="ghost" id="clearBtn">Clear Form</button>
      </div>
    </section>

    <!-- ============ HISTORY ============ -->
    <section class="screen" id="screen-history">
      <div class="search-row">
        <input type="text" id="searchBox" placeholder="Search outlet, stockist, city...">
      </div>
      <div class="filter-chip-row" id="filterChips">
        <div class="chip sel" data-f="all">All</div>
        <div class="chip" data-f="yes">Converted</div>
        <div class="chip" data-f="no">Not Converted</div>
        <div class="chip" data-f="Reseller">Reseller</div>
        <div class="chip" data-f="Garage">Garage</div>
      </div>
      <div id="historyList"></div>
      <button class="ghost" id="exportBtn">Export CSV</button>
    </section>

    <!-- ============ DASHBOARD ============ -->
    <section class="screen" id="screen-dash">
      <div class="stat-grid">
        <div class="stat-card"><div class="n" id="statTotal">0</div><div class="l">Total Visits</div></div>
        <div class="stat-card"><div class="n" id="statConv">0%</div><div class="l">Conversion Rate</div></div>
        <div class="stat-card"><div class="n" id="statShare">0%</div><div class="l">Avg. Servo Share</div></div>
        <div class="stat-card"><div class="n" id="statVol">0</div><div class="l">Avg. Vol / Month (L)</div></div>
      </div>

      <div class="section-title">Outlets by Category</div>
      <div id="catBars"></div>

      <div class="section-title">Outlets by Type</div>
      <div id="typeBars"></div>

      <div class="section-title">Brand Preference (Rank 1 mentions)</div>
      <div id="brandBars"></div>
    </section>

  </main>

  <nav class="tabs">
    <button class="tab-btn active" data-s="new"><span class="ic">＋</span>New Visit</button>
    <button class="tab-btn" data-s="history"><span class="ic">☰</span>History</button>
    <button class="tab-btn" data-s="dash"><span class="ic">◆</span>Dashboard</button>
  </nav>

</div>

<div id="toast"></div>

<script>
// =====================================================================
// BACKEND CONFIG — paste your deployed Google Apps Script Web App URL
// here (see SETUP-INSTRUCTIONS.md). It looks like:
// https://script.google.com/macros/s/AKfycb.../exec
// =====================================================================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbynqqjBg7_-5lE69_ic79lBJt2Of7lAoyU3G4gVAuGeZnbWqrQC3Pgcpg-jD1sfT58/exec';

const BRANDS_DEFAULT = ['Servo','Castrol','Motul','Shell','Valvoline','Gulf','Pensol'];
let visits = [];
let currentRank = [...BRANDS_DEFAULT];
let editingId = null;
let dragSrcIdx = null;

// ---------- backend sync ----------
function backendReady(){
  return SCRIPT_URL && !SCRIPT_URL.startsWith('PASTE_');
}

function setSyncState(state){
  // state: 'idle' | 'syncing' | 'ok' | 'error' | 'unconfigured'
  const el = document.getElementById('odo');
  if(!el) return;
  el.classList.remove('sync-error');
  if(state === 'unconfigured'){ el.classList.add('sync-error'); }
  if(state === 'error'){ el.classList.add('sync-error'); }
}

async function loadVisits(){
  if(!backendReady()){
    setSyncState('unconfigured');
    showToast('Backend not connected yet — see SETUP-INSTRUCTIONS.md');
    return;
  }
  setSyncState('syncing');
  try{
    const res = await fetch(SCRIPT_URL, { method:'GET' });
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    visits = Array.isArray(data) ? data : [];
    setSyncState('ok');
  }catch(e){
    setSyncState('error');
    showToast('Could not reach the shared sheet — check your connection');
  }
}

async function saveVisitRemote(record){
  if(!backendReady()){
    showToast('Backend not connected yet — see SETUP-INSTRUCTIONS.md');
    return false;
  }
  try{
    const res = await fetch(SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight on Apps Script
      body: JSON.stringify({ action:'save', record })
    });
    const data = await res.json();
    return !!data.success;
  }catch(e){
    showToast('Could not save to the shared sheet — check your connection');
    return false;
  }
}

async function deleteVisitRemote(id){
  if(!backendReady()){
    showToast('Backend not connected yet — see SETUP-INSTRUCTIONS.md');
    return false;
  }
  try{
    const res = await fetch(SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'delete', id })
    });
    const data = await res.json();
    return !!data.success;
  }catch(e){
    showToast('Could not delete from the shared sheet — check your connection');
    return false;
  }
}

// ---------- GPS address capture ----------
let capturedLat = null;
let capturedLng = null;

document.getElementById('geoBtn').addEventListener('click', ()=>{
  const statusEl = document.getElementById('geoStatus');
  const btn = document.getElementById('geoBtn');

  if(!navigator.geolocation){
    statusEl.textContent = 'GPS not supported on this device — enter address manually';
    statusEl.className = 'geo-status err';
    return;
  }

  btn.disabled = true;
  btn.textContent = '📍 Locating...';
  statusEl.textContent = '';
  statusEl.className = 'geo-status';

  navigator.geolocation.getCurrentPosition(
    async (pos)=>{
      capturedLat = pos.coords.latitude;
      capturedLng = pos.coords.longitude;
      statusEl.textContent = 'Finding address...';
      try{
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${capturedLat}&lon=${capturedLng}&zoom=18&addressdetails=1`);
        const data = await res.json();
        if(data && data.display_name){
          document.getElementById('address').value = data.display_name;
          statusEl.textContent = `Captured ✓ (±${Math.round(pos.coords.accuracy)}m) — edit below if needed`;
          statusEl.className = 'geo-status ok';
        } else {
          statusEl.textContent = `Got coordinates (${capturedLat.toFixed(5)}, ${capturedLng.toFixed(5)}) — type address manually`;
          statusEl.className = 'geo-status err';
        }
      }catch(e){
        statusEl.textContent = `Got coordinates (${capturedLat.toFixed(5)}, ${capturedLng.toFixed(5)}) — couldn't look up address, type it manually`;
        statusEl.className = 'geo-status err';
      }
      btn.disabled = false;
      btn.textContent = '📍 Use Current Location';
    },
    (err)=>{
      let msg = 'Could not get location — enter address manually';
      if(err.code === err.PERMISSION_DENIED) msg = 'Location permission denied — enter address manually';
      if(err.code === err.TIMEOUT) msg = 'Location request timed out — enter address manually';
      statusEl.textContent = msg;
      statusEl.className = 'geo-status err';
      btn.disabled = false;
      btn.textContent = '📍 Use Current Location';
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
  );
});

// ---------- gauge ----------
const CIRC = 251.3;
const gaugeArc = document.getElementById('gaugeArc');
const gaugeVal = document.getElementById('gaugeVal');
document.getElementById('marketShare').addEventListener('input', e=>{
  const v = +e.target.value;
  gaugeVal.textContent = v + '%';

// ---------- brand ranking (drag reorder) ----------
function renderRankList(){
  const el = document.getElementById('rankList');
  el.innerHTML = '';
  currentRank.forEach((brand, i)=>{
    const item = document.createElement('div');
    item.className = 'rank-item';
    item.draggable = true;
    item.dataset.idx = i;
    item.innerHTML = `<div class="num">${i+1}</div><div class="name">${brand}</div><div class="grip">≡</div>`;
    item.addEventListener('dragstart', ()=>{ dragSrcIdx = i; item.classList.add('dragging'); });
    item.addEventListener('dragend', ()=>{ item.classList.remove('dragging'); });
    item.addEventListener('dragover', ev=>ev.preventDefault());
    item.addEventListener('drop', ()=>{
      const destIdx = i;
      if(dragSrcIdx === null || dragSrcIdx === destIdx) return;
      const moved = currentRank.splice(dragSrcIdx,1)[0];
      currentRank.splice(destIdx,0,moved);
      renderRankList();
    });
    // touch support (simple long-press reorder via touchmove)
    let touchStartY = null;
    item.addEventListener('touchstart', ev=>{ touchStartY = ev.touches[0].clientY; dragSrcIdx = i; }, {passive:true});
    item.addEventListener('touchmove', ev=>{
      const y = ev.touches[0].clientY;
      const els = [...document.querySelectorAll('.rank-item')];
      const under = els.find(x=>{
        const r = x.getBoundingClientRect();
        return y > r.top && y < r.bottom;
      });
      if(under){
        const destIdx = +under.dataset.idx;
        if(destIdx !== dragSrcIdx){
          const moved = currentRank.splice(dragSrcIdx,1)[0];
          currentRank.splice(destIdx,0,moved);
          dragSrcIdx = destIdx;
          renderRankList();
        }
      }
    }, {passive:true});
    el.appendChild(item);
  });
}
renderRankList();

// ---------- save / clear ----------
function resetForm(){
  document.getElementById('stockistName').value = '';
  document.getElementById('visitDate').value = new Date().toISOString().slice(0,10);
  document.querySelectorAll('#visitType button').forEach(x=>x.classList.remove('sel'));
  document.querySelector('#visitType button[data-v="Reseller"]').classList.add('sel');
  document.getElementById('ownerLbl').textContent = 'Name of Reseller';
  document.getElementById('ownerName').value = '';
  document.getElementById('contact').value = '';
  document.getElementById('address').value = '';
  capturedLat = null;
  capturedLng = null;
  document.getElementById('geoStatus').textContent = '';
  document.getElementById('geoStatus').className = 'geo-status';
  document.querySelectorAll('#categoryChips .chip').forEach(c=>c.classList.remove('sel'));
  document.getElementById('volume').value = '';
  currentRank = [...BRANDS_DEFAULT];
  renderRankList();
  document.getElementById('marketShare').value = 0;
  gaugeVal.textContent = '0%';
  gaugeArc.setAttribute('stroke-dashoffset', CIRC);
  document.getElementById('branding').value = '';
  document.getElementById('productReq').value = '';
  document.querySelectorAll('#converted button').forEach(x=>x.classList.remove('sel'));
  document.getElementById('remarks').value = '';
  editingId = null;
  document.getElementById('saveBtn').textContent = 'Save Visit';
}
resetForm();

document.getElementById('clearBtn').addEventListener('click', resetForm);

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const stockistName = document.getElementById('stockistName').value.trim();
  const ownerName = document.getElementById('ownerName').value.trim();
  if(!stockistName){ showToast('Select name of stockist'); return; }
  if(!ownerName){ showToast('Enter reseller / mechanic name'); return; }

  const visitType = document.querySelector('#visitType button.sel')?.dataset.v || 'Reseller';
  const categories = [...document.querySelectorAll('#categoryChips .chip.sel')].map(c=>c.dataset.v);
  const convertedBtn = document.querySelector('#converted button.sel');

  const record = {
    id: editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
    stockistName,
    visitDate: document.getElementById('visitDate').value || new Date().toISOString().slice(0,10),
    visitType,
    ownerName,
    contact: document.getElementById('contact').value.trim(),
    address: document.getElementById('address').value.trim(),
    latitude: capturedLat !== null ? capturedLat : '',
    longitude: capturedLng !== null ? capturedLng : '',
    categories,
    volume: document.getElementById('volume').value,
    brandRank: [...currentRank],
    marketShare: document.getElementById('marketShare').value,
    branding: document.getElementById('branding').value.trim(),
    productReq: document.getElementById('productReq').value.trim(),
    converted: convertedBtn ? convertedBtn.dataset.v : '',
    remarks: document.getElementById('remarks').value.trim(),
    savedAt: new Date().toISOString()
  };

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving...';
  const ok = await saveVisitRemote(record);
  saveBtn.disabled = false;

  if(ok){
    if(editingId){
      const idx = visits.findIndex(v=>v.id === editingId);
      if(idx > -1) visits[idx] = record; else visits.unshift(record);
    } else {
      visits.unshift(record);
    }
    updateOdo();
    showToast(editingId ? 'Visit updated' : 'Visit saved to shared sheet');
    resetForm();
  } else {
    saveBtn.textContent = editingId ? 'Update Visit' : 'Save Visit';
  }
});

function updateOdo(){
  document.getElementById('odo').textContent = String(visits.length).padStart(3,'0') + ' VISITS';
}

// ---------- history ----------
let activeFilter = 'all';
document.getElementById('filterChips').addEventListener('click', e=>{
  const c = e.target.closest('.chip'); if(!c) return;
  document.querySelectorAll('#filterChips .chip').forEach(x=>x.classList.remove('sel'));
  c.classList.add('sel');
  activeFilter = c.dataset.f;
  renderHistory();
});
document.getElementById('searchBox').addEventListener('input', renderHistory);

function renderHistory(){
  const list = document.getElementById('historyList');
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  let filtered = visits.filter(v=>{
    if(activeFilter === 'yes' && v.converted !== 'Yes') return false;
    if(activeFilter === 'no' && v.converted !== 'No') return false;
    if(activeFilter === 'Reseller' && v.visitType !== 'Reseller') return false;
    if(activeFilter === 'Garage' && v.visitType !== 'Garage') return false;
    if(q){
      const hay = [v.stockistName, v.ownerName, v.address, v.contact].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty"><div class="ic">🗒️</div><p>No visits logged yet.<br>Fill the New Visit tab to start your beat log.</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(v=>{
    const cats = (v.categories||[]).join(' · ') || '—';
    const top3 = (v.brandRank||[]).slice(0,3).join(' > ') || '—';
    return `
    <div class="visit-card" data-id="${v.id}">
      <div class="vc-top">
        <div>
          <div class="vc-name">${escapeHtml(v.ownerName)}</div>
          <div class="vc-type">${v.visitType} · ${cats}</div>
        </div>
        <div class="vc-badge ${v.converted === 'Yes' ? 'yes':'no'}">${v.converted === 'Yes' ? 'Converted' : 'Not Converted'}</div>
      </div>
      <div class="vc-meta">
        <span>👤 <b>${escapeHtml(v.stockistName)}</b></span>
        <span>📅 <b>${v.visitDate}</b></span>
        <span>📞 <b>${escapeHtml(v.contact||'—')}</b></span>
        <span>🛢️ <b>${v.volume||0} L/mo</b></span>
        <span>📈 Servo <b>${v.marketShare||0}%</b></span>
      </div>
      <div class="vc-meta" style="margin-top:2px;"><span>🏆 ${escapeHtml(top3)}</span></div>
      ${v.remarks ? `<div class="vc-remarks">"${escapeHtml(v.remarks)}"</div>` : ''}
      <div class="vc-actions">
        <button class="edit">Edit</button>
        <button class="del">Delete</button>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.edit').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = e.target.closest('.visit-card').dataset.id;
      loadIntoForm(id);
    });
  });
  list.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const id = e.target.closest('.visit-card').dataset.id;
      if(!confirm('Delete this visit record for everyone?')) return;
      const ok = await deleteVisitRemote(id);
      if(!ok) return;
      visits = visits.filter(v=>v.id !== id);
      updateOdo();
      renderHistory();
      showToast('Visit deleted');
    });
  });
}

function loadIntoForm(id){
  const v = visits.find(x=>x.id === id);
  if(!v) return;
  editingId = id;
  document.getElementById('stockistName').value = v.stockistName;
  document.getElementById('visitDate').value = v.visitDate;
  document.querySelectorAll('#visitType button').forEach(x=>x.classList.toggle('sel', x.dataset.v === v.visitType));
  document.getElementById('ownerLbl').textContent = v.visitType === 'Garage' ? 'Name of Garage / Mechanic' : 'Name of Reseller';
  document.getElementById('ownerName').value = v.ownerName;
  document.getElementById('contact').value = v.contact;
  document.getElementById('address').value = v.address;
  capturedLat = v.latitude !== undefined && v.latitude !== '' ? v.latitude : null;
  capturedLng = v.longitude !== undefined && v.longitude !== '' ? v.longitude : null;
  const geoStatus = document.getElementById('geoStatus');
  if(capturedLat !== null && capturedLng !== null){
    geoStatus.textContent = `Location on file (${(+capturedLat).toFixed(5)}, ${(+capturedLng).toFixed(5)})`;
    geoStatus.className = 'geo-status ok';
  } else {
    geoStatus.textContent = '';
    geoStatus.className = 'geo-status';
  }
  document.querySelectorAll('#categoryChips .chip').forEach(c=>c.classList.toggle('sel', (v.categories||[]).includes(c.dataset.v)));
  document.getElementById('volume').value = v.volume;
  currentRank = v.brandRank && v.brandRank.length ? [...v.brandRank] : [...BRANDS_DEFAULT];
  renderRankList();
  document.getElementById('marketShare').value = v.marketShare || 0;
  gaugeVal.textContent = (v.marketShare||0) + '%';
  gaugeArc.setAttribute('stroke-dashoffset', CIRC - (CIRC * (v.marketShare||0)/100));
  document.getElementById('branding').value = v.branding;
  document.getElementById('productReq').value = v.productReq;
  document.querySelectorAll('#converted button').forEach(x=>x.classList.toggle('sel', x.dataset.v === v.converted));
  document.getElementById('remarks').value = v.remarks;
  document.getElementById('saveBtn').textContent = 'Update Visit';
  document.querySelector('.tab-btn[data-s="new"]').click();
  window.scrollTo(0,0);
}

function escapeHtml(s){
  if(!s) return '';
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- export ----------
document.getElementById('exportBtn').addEventListener('click', ()=>{
  if(visits.length === 0){ showToast('No visits to export'); return; }
  const headers = ['Name of Stockist','Date of Visit','Type','Reseller/Mechanic Name','Contact Number','Address','Latitude','Longitude','Category','Volume per Month (L)','Brand Preference Ranking','Servo Market Share (%)','Branding Requirement','Product Requirement','Converted to Servo','Remarks'];
  const rows = visits.map(v=>[
    v.stockistName, v.visitDate, v.visitType, v.ownerName, v.contact, v.address, v.latitude, v.longitude,
    (v.categories||[]).join('/'), v.volume, (v.brandRank||[]).join(' > '),
    v.marketShare, v.branding, v.productReq, v.converted, v.remarks
  ]);
  const csv = [headers, ...rows].map(r=>r.map(csvEsc).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'beatlog_visits_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV exported');
});
function csvEsc(v){
  const s = (v===undefined||v===null) ? '' : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

// ---------- dashboard ----------
function renderDashboard(){
  const total = visits.length;
  document.getElementById('statTotal').textContent = total;
  if(total === 0){
    document.getElementById('statConv').textContent = '0%';
    document.getElementById('statShare').textContent = '0%';
    document.getElementById('statVol').textContent = '0';
    document.getElementById('catBars').innerHTML = emptyBars();
    document.getElementById('typeBars').innerHTML = emptyBars();
    document.getElementById('brandBars').innerHTML = emptyBars();
    return;
  }
  const convCount = visits.filter(v=>v.converted === 'Yes').length;
  document.getElementById('statConv').textContent = Math.round(convCount/total*100) + '%';
  const avgShare = visits.reduce((s,v)=>s+(+v.marketShare||0),0)/total;
  document.getElementById('statShare').textContent = Math.round(avgShare) + '%';
  const avgVol = visits.reduce((s,v)=>s+(+v.volume||0),0)/total;
  document.getElementById('statVol').textContent = Math.round(avgVol);

  // category breakdown
  const catCount = {};
  visits.forEach(v=>(v.categories||[]).forEach(c=>catCount[c]=(catCount[c]||0)+1));
  document.getElementById('catBars').innerHTML = barsFrom(catCount, total);

  // type breakdown
  const typeCount = {};
  visits.forEach(v=>typeCount[v.visitType]=(typeCount[v.visitType]||0)+1);
  document.getElementById('typeBars').innerHTML = barsFrom(typeCount, total);

  // brand rank-1 mentions
  const brandCount = {};
  visits.forEach(v=>{ const top = (v.brandRank||[])[0]; if(top) brandCount[top]=(brandCount[top]||0)+1; });
  document.getElementById('brandBars').innerHTML = barsFrom(brandCount, total);
}
function emptyBars(){
  return `<div class="empty" style="padding:20px;"><p>No data yet — log a visit to see stats.</p></div>`;
}
function barsFrom(obj, total){
  const entries = Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  if(entries.length === 0) return emptyBars();
  return entries.map(([label,count])=>{
    const pct = Math.round(count/total*100);
    return `<div class="bar-row">
      <div class="bl"><span>${escapeHtml(label)}</span><b>${count}</b></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>
    </div>`;
  }).join('');
}

// ---------- init ----------
(async function init(){
  await loadVisits();
  updateOdo();
  document.getElementById('visitDate').value = new Date().toISOString().slice(0,10);
})();
